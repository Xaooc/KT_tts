<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kill Team — помощник партии</title>
<style>
:root{color-scheme:dark;--bg:#111619;--surface:#1b2328;--panel:#202a30;--line:#35424a;--text:#edf2f4;--muted:#b0bec5;--accent:#f09a60;--accent-dark:#3b2b20;--blue:#9bc7e4;--green:#aed7b2;--red:#f8ae9d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'Segoe UI',Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:5px;background:#29343b;color:var(--text);padding:9px 13px;font-weight:600}button:hover:not(:disabled){background:#354650;border-color:#6d818d}button:disabled{cursor:default;opacity:.52}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button.primary{background:var(--accent);border-color:var(--accent);color:#172027}button.primary:hover:not(:disabled){background:#ffb783}button.ghost{background:transparent}button.small{padding:6px 10px;font-size:13px}a{color:var(--blue)}p{margin:8px 0}.muted{color:var(--muted)}.smalltext{font-size:13px}.caps{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--accent)}.page{max-width:1440px;margin:auto;padding:22px 24px}.reviewbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.reviewtitle{display:flex;align-items:center;gap:12px}.brand{display:grid;place-items:center;background:var(--accent);color:#101619;font-size:19px;font-weight:800;width:40px;height:40px}.reviewtitle strong{font-size:20px}.scene-tabs{display:flex;gap:6px;flex-wrap:wrap}.scene-tabs button{background:transparent}.scene-tabs [aria-selected=true]{border-color:var(--accent);color:var(--accent);background:var(--accent-dark)}.toolbar{display:flex;align-items:center;gap:20px;background:var(--surface);border-block:1px solid var(--line);padding:13px 18px;flex-wrap:wrap}.roundblock{display:flex;gap:12px;align-items:center;min-width:200px}.roundnumber{font-size:30px;font-weight:750;line-height:1}.phase{font-size:16px;font-weight:700}.players{display:flex;gap:25px;margin-left:auto}.player{display:flex;gap:12px;align-items:center}.playername{font-size:13px}.player strong{font-size:20px;font-variant-numeric:tabular-nums}.player i{font-style:normal;font-size:11px;color:var(--muted);display:block}.player.red{border-left:3px solid var(--accent);padding-left:12px}.player.blue{border-left:3px solid var(--blue);padding-left:12px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:18px;margin-top:18px;align-items:start}.field{min-height:540px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 45% 40%,#243033,#151d20);border:1px solid var(--line);border-radius:6px}.field svg{display:block;width:100%;height:420px}.field-label{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}.field-label strong{font-size:14px}.field-note{position:absolute;bottom:18px;left:18px;right:18px;color:var(--muted);font-size:13px}.roster{display:flex;flex-wrap:wrap;gap:8px}.roster span{background:#152025;padding:8px 10px;border:1px solid var(--line);border-radius:4px}.roster .selected{border-color:var(--accent)}.dock{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}.dock-top{padding:18px 18px 14px;border-bottom:1px solid var(--line)}h1{font-size:23px;line-height:1.2;margin:5px 0 4px;letter-spacing:-.025em}h2{font-size:16px;margin:0 0 8px}h3{font-size:15px;margin:0 0 5px}.dock-body{padding:16px 18px}.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.statrow span{display:block;font-size:14px;color:var(--muted);font-weight:700}.statrow strong{font-size:25px;font-variant-numeric:tabular-nums;line-height:1.3}.statrow .ap strong{color:var(--accent)}.badge{font-size:12px;border-radius:3px;background:#303e46;color:var(--text);padding:3px 7px;display:inline-block}.badge.active{background:var(--accent-dark);color:var(--accent)}.badge.good{background:#263c30;color:var(--green)}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action-grid button{text-align:left;padding:11px 12px}.action-grid button b{display:block}.action-grid button span{font-size:12px;color:var(--muted);font-weight:400}.section{margin-top:17px;padding-top:15px;border-top:1px solid var(--line)}.effect{padding:10px 0;border-bottom:1px solid var(--line)}.effect:last-child{border-bottom:0}.effect-title{display:flex;justify-content:space-between;gap:8px;font-weight:650}.effect p{font-size:13px;color:var(--muted);margin:3px 0}.term{display:inline;padding:0;border:0;border-bottom:1px dotted var(--accent);border-radius:0;background:transparent;color:var(--text);font-weight:700}.term:hover:not(:disabled){background:var(--accent-dark)}.summary{padding:12px;background:var(--panel);border-left:3px solid var(--accent);margin:12px 0}.summary p{margin:4px 0;font-size:14px}.summary strong{color:var(--accent)}.check{display:flex;gap:9px;align-items:flex-start;margin:14px 0;font-size:13px;color:var(--muted)}.check input{width:18px;height:18px;flex:none;accent-color:var(--accent);margin:2px 0 0}.full{width:100%}.bottom-actions{display:flex;gap:8px;margin-top:14px}.bottom-actions button{flex:1}.dock-footer{padding:12px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.status{padding:9px 12px;margin-top:12px;font-size:13px;color:var(--green);border-left:3px solid var(--green);background:#182a20}.status.error{color:var(--red);border-color:var(--red);background:#342321}.journal{list-style:none;padding:0;margin:0}.journal li{padding:6px 0;color:var(--muted);font-size:13px}.journal li:first-child{color:var(--text)}.scene-note{margin:16px 0;color:var(--muted);font-size:13px}.rule-dialog{max-width:650px;background:var(--surface);color:var(--text);border:1px solid #75858d;border-radius:7px;padding:22px;width:calc(100% - 32px);max-height:85vh;overflow-y:auto}.rule-dialog::backdrop{background:#000a}.rule-dialog .close{float:right}.rule-dialog h2{font-size:22px;margin:0 40px 8px 0}.rule-dialog p{margin:12px 0}.round-step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.stepnum{font-size:12px;color:var(--accent);font-weight:800;flex:none;width:18px;margin-top:2px}.row-between{display:flex;justify-content:space-between;gap:12px;align-items:center}.hidden{display:none!important}.diagram-word{font-family:'Segoe UI',Arial,sans-serif;font-size:15px;fill:#ced9dd}.diagram-small{font-size:12px;fill:#a1b0b6}.diagram-objective{font-size:15px;font-weight:700;fill:#1f282d}.help-footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:12px}.legend{font-size:12px;color:var(--muted)}@media(max-width:950px){.page{padding:16px}.workspace{grid-template-columns:minmax(0,1fr) 380px}.players{gap:15px}.playername{max-width:120px}.toolbar{gap:12px}.field svg{height:400px}}@media(max-width:760px){.reviewbar{align-items:flex-start;flex-direction:column}.workspace{grid-template-columns:1fr}.field{min-height:270px;order:2}.field svg{height:220px}.field-note{position:static;padding:0 18px 18px}.players{margin-left:0;flex-wrap:wrap}.toolbar{padding:12px}.dock{order:1}.roster{margin-top:0}.page{padding:12px}.statrow strong{font-size:24px}.scene-tabs{width:100%}.scene-tabs button{flex:1;padding:8px 9px}.reviewtitle strong{font-size:18px}}
</style></head><body><main class="page">
<div class="reviewbar"><div class="reviewtitle"><span class="brand">KT</span><div><strong>Помощник партии</strong><div class="muted smalltext">Примеры интерфейса · первая итерация</div></div></div><nav class="scene-tabs" aria-label="Пример"><button data-scene="activation" aria-selected="true">Активация</button><button data-scene="shoot" aria-selected="false">Уловка</button><button data-scene="round" aria-selected="false">Новый раунд</button></nav></div>
<div id="toolbar" class="toolbar" aria-label="Состояние партии"></div>
<div class="workspace"><section class="field" aria-label="Схематичный пример игрового поля"><div class="field-label"><strong>Круг Иеротек</strong><span class="legend">Схема поля</span></div>
<svg viewBox="0 0 690 420" role="img" aria-label="Три оперативника и маркеры целей среди террейна"><defs><pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#405050" stroke-opacity=".2"/></pattern></defs><rect x="20" y="10" width="650" height="350" rx="5" fill="url(#grid)"/><g fill="#324043" stroke="#536262" stroke-width="1"><path d="M75 65H230V105H115V175H75Z"/><path d="M470 200H600V310H560V242H470Z"/><rect x="270" y="160" width="100" height="35"/><rect x="400" y="45" width="38" height="86"/></g><g fill="#c3c6b1"><circle cx="320" cy="95" r="17"/><circle cx="155" cy="260" r="17"/><circle cx="460" cy="300" r="17"/></g><g class="diagram-objective" text-anchor="middle"><text x="320" y="100">1</text><text x="155" y="265">2</text><text x="460" y="305">3</text></g><g data-unit="immortal"><circle cx="265" cy="270" r="27" fill="#2b342e" stroke="#f09a60" stroke-width="3"/><path d="M255 270V252H275V270L270 278H260Z" fill="#a5b5a7"/><path d="M252 261H278M260 269H270" stroke="#29322b" stroke-width="3"/><text class="diagram-word" x="265" y="318" text-anchor="middle">Бессмертный страж</text><text class="diagram-small" x="265" y="338" text-anchor="middle">Карабин Теслы</text></g><g data-unit="apprentek"><circle cx="108" cy="210" r="21" fill="#283c35" stroke="#789384" stroke-width="2"/><path d="M103 199L113 199L116 213L108 219L100 213Z" fill="#82998a"/><text class="diagram-small" x="75" y="244">Подмастерье</text></g><g data-unit="devotee"><circle cx="487" cy="123" r="23" fill="#263942" stroke="#9bc7e4" stroke-width="2"/><path d="M479 128V117L487 107L495 117V128Z" fill="#7e9caa"/><text class="diagram-small" x="487" y="162" text-anchor="middle">Последователь</text></g><path id="movement-path" d="M199 302L241 280" stroke="#f09a60" stroke-width="2" stroke-dasharray="5 5" fill="none"/></svg>
<div class="field-note"><div id="roster" class="roster"></div><p>Значки показывают учёт в помощнике. Геометрию, цели и условия действий проверяют игроки.</p></div></section>
<aside id="dock" class="dock" aria-label="Панель помощника"></aside></div>
<p id="scene-note" class="scene-note"></p><div class="help-footer"><span>Предпросмотр · установленный мод пока без этих изменений</span><span>APL · AP · WND · CP сохраняют оригинальные сокращения</span></div>
</main><dialog id="rule-dialog" class="rule-dialog"><button class="small ghost close" id="close-rule" aria-label="Закрыть правило">×</button><h2 id="rule-title"></h2><div id="rule-body"></div></dialog>
<script>
const DATA=/*ASSISTANT_DATA*/;
const GRAPH=/*ASSISTANT_GRAPH*/;
const nodes=GRAPH.nodes;let nodeId='activation',scene='activation',confirmed=false,message='',error=false,selectedUnit='immortal';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const array=o=>Array.isArray(o)?o:Object.values(o||{}).filter(Boolean);
const phases={firefight:'Перестрелка',scoring:'Подсчёт очков',initiative:'Инициатива',ready:'Подготовка',gambit:'Стратегические гамбиты',finished:'Партия завершена'};
function state(){return nodes[nodeId].state}function edges(){return nodes[nodeId].edges||{}}
function labelOwner(id){return state().players[id]?.name||''}
function effects(s,target){return array(s.effects).filter(e=>e.owner==='red-id'&&(!target||e.target===target||e.target==='team'))}
function effectRows(list){return list.length?list.map(e=>`<div class="effect"><div class="effect-title"><span>${esc(e.title)}</span><span class="badge">Эффект</span></div><p>${esc(e.expiryLabel)}</p><p>${esc(e.text)}</p></div>`).join(''):'<p class="muted smalltext">Нет отмеченных временных эффектов.</p>'}
function button(key,text,primary=false,disabled=false){return `<button class="${primary?'primary ':''}full" data-step="${key}" ${disabled||!edges()[key]?'disabled':''}>${text}</button>`}
function check(text){return `<label class="check"><input id="confirm" type="checkbox" ${confirmed?'checked':''}><span>${text}</span></label>`}
function journal(s){return array(s.journal).slice(-3).reverse().map(e=>`<li>${esc(e.label)}</li>`).join('')}
function beginHeader(kicker,title,english){return `<div class="dock-top"><div class="caps">${kicker}</div><h1>${esc(title)}</h1><div class="muted smalltext">${esc(english)}</div>`}
function render(){
 const s=state(),a=s.activation,u=s.units[selectedUnit];
 $('toolbar').innerHTML=`<div class="roundblock"><span class="roundnumber">${s.round}<span class="muted smalltext"> / ${s.maxRounds}</span></span><div><div class="phase">${esc(phases[s.phase])}</div><div class="muted smalltext">${s.initiative?'Инициатива: '+esc(labelOwner(s.initiative)):'Выберите инициативу после определения результата'}</div></div></div><div class="players">${Object.entries(s.players).map(([id,p])=>`<div class="player ${id==='red-id'?'red':'blue'}"><div class="playername">${esc(p.name)}<div class="muted smalltext">${id==='red-id'?'Ваш отряд':'Соперник'}</div></div><div><strong>${p.cp}</strong><i>CP</i></div><div><strong>${p.vp}</strong><i>Очки</i></div></div>`).join('')}</div>`;
 $('roster').innerHTML=Object.values(s.units).filter(x=>x.owner==='red-id').map(x=>`<span class="${x.id===selectedUnit?'selected':''}">${esc(x.name)} · ${x.wounds}/${x.maxWounds} WND · ${x.ready?'○ готов':'✓ использован'}</span>`).join('');
 if(scene==='round')renderRound(s);else if(scene==='shoot')renderPloy(s);else renderActivation(s,u,a);
 if(message){const n=document.createElement('div');n.className='status'+(error?' error':'');n.setAttribute('role',error?'alert':'status');n.textContent=message;$('dock').appendChild(n)}
 $('scene-note').textContent=scene==='activation'?'Пример 1. Оперативник уже выполнил перемещение. Отметь стрельбу или рывок и посмотри, как меняются AP.':scene==='shoot'?'Пример 2. Стрельба карабином Теслы уже начата. Подтверди условие уловки, примени её и попробуй отмену.':'Пример 3. Подсчёт очков завершён вручную. Проследи, какие эффекты уйдут, когда начислятся CP и как начнутся гамбиты.';
 document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-selected',b.dataset.scene===scene?'true':'false'));
}
function renderActivation(s,u,a){
 const active=a&&a.unit===u.id,remain=active?Math.max(0,a.ap-a.spent):0;
 let html=beginHeader(active?'Текущая активация':'Активация завершена',u.name,u.english);
 html+=`<div class="statrow"><div><span>WND</span><strong>${u.wounds}<small class="muted smalltext">/${u.maxWounds}</small></strong></div><div><span>APL</span><strong>${u.apl}</strong></div><div class="ap"><span>Осталось AP</span><strong>${active?remain:'—'}</strong></div><div><span>Приказ</span><strong style="font-size:16px">${u.order}</strong></div></div></div><div class="dock-body">`;
 if(active&&a.pending){html+=`<span class="badge active">Действие в процессе</span><h2 style="margin-top:9px">Стрельба · карабин Теслы</h2><p class="muted smalltext">В этом окне можно применить «Живую молнию».</p><div class="bottom-actions"><button class="primary" data-open-ploy>Уловка · 1 CP</button><button data-step="resolve">Завершить действие</button></div>`}
 else if(active){html+=`<div class="row-between"><h2>Действия</h2><span class="muted smalltext">Потрачено ${a.spent} / ${a.ap} AP</span></div><div class="action-grid"><button disabled title="Действие уже отмечено"><b>✓ Перемещение</b><span>Reposition · 1 AP</span></button><button data-step="dash" ${!edges().dash?'disabled':''}><b>Рывок <span>· 1 AP</span></b><span>Dash</span></button><button data-step="shoot" ${!edges().shoot?'disabled':''}><b>Стрельба <span>· 1 AP</span></b><span>Shoot · карабин Теслы</span></button><button data-rule="ap"><b>Стоимость и AP ↗</b><span>Условия и исключения</span></button></div><div class="bottom-actions">${button('finish','Завершить активацию',remain===0)}</div><p class="muted smalltext">Можно закончить, сохранив неиспользованные AP.</p>`}
 else html+=`<div class="summary"><strong>✓ Оперативник использован</strong><p>Теперь очередь: ${esc(labelOwner(s.turnOwner))}.</p></div><button class="full ghost" data-reset>Вернуться к началу примера</button>`;
 html+=`<div class="section"><h2>Временные эффекты</h2>${effectRows(effects(s,u.id))}</div><div class="section"><h2>Последние действия</h2><ul class="journal">${journal(s)}</ul></div></div><div class="dock-footer">Учёт действий · условия выполнения подтверждают игроки</div>`;$('dock').innerHTML=html;
}
 function renderPloy(s){
 const p=s.players['red-id'],active=effects(s,'immortal').find(x=>x.title==='Живая молния'),pending=s.activation?.pending;
 let html=beginHeader('Боевая уловка','Живая молния','Living Lightning · Круг Иеротек');html+=`</div><div class="dock-body"><div class="summary">${pending?'<span class="badge active">Стрельба в процессе</span>':''}<p><b>Оперативник:</b> Бессмертный страж</p><p><b>Профиль:</b> карабин Теслы</p>${pending?`<p><b>AP:</b> ${s.activation.spent} / ${s.activation.ap} потрачено · ${Math.max(0,s.activation.ap-s.activation.spent)} осталось</p>`:''}<p><b>CP:</b> ${p.cp}${!active&&edges().apply?' → '+(p.cp-1):''} · <b>лимит:</b> раз за раунд</p></div><h2>Когда применять</h2><p>При выборе карабина Теслы для <button class="term" data-rule="shoot">Стрельбы</button> дружественного <b>IMMORTAL</b>.</p><h2 class="section">Эффект до конца действия</h2><p>Оружие получает <button class="term" data-rule="blast">Blast 2″</button>. У <button class="term" data-rule="devastating">Devastating 1</button> убирается дистанционное условие <b>2″</b>.</p>`;
 if(active){html+=`<span class="badge good">✓ Применена · эффект действует</span><div class="bottom-actions">${button('resolve','Завершить стрельбу',true)}${button('undo','Отменить уловку')}</div><p class="muted smalltext">Отмена вернёт 1 CP и снимет эффект. Результаты кубиков сохраняются.</p>`}
 else if(edges().apply){html+=check('Подтверждаю: выбран карабин Теслы, условия и момент применения соблюдены.')+button('apply','Применить · 1 CP',true,!confirmed)+`<div class="bottom-actions">${button('resolve','Закончить без уловки')}${button('undo','Отменить начало стрельбы')}</div>`}
 else if(s.activation&&!pending&&edges().shoot){html+=`<span class="badge">Начало стрельбы отменено · AP возвращены</span><button class="full primary" data-show-activation>Вернуться к действиям</button>`}
 else{html+=`<span class="badge">Действие завершено · временного эффекта нет</span><div class="bottom-actions">${button('finish','Завершить активацию',true)}<button class="ghost" data-reset>Сначала</button></div>`}
 html+=`<div class="section row-between"><button class="ghost small" data-rule="lightning">Полное правило ↗</button><details><summary class="muted smalltext">История</summary><ul class="journal">${journal(s)}</ul></details></div></div><div class="dock-footer">Цель стрельбы и условия проверяются на поле</div>`;$('dock').innerHTML=html;
}
function renderRound(s){
 let title=phases[s.phase];let html=beginHeader('Переход между раундами',title,'Раунд '+s.round+' · общие действия партии')+'</div><div class="dock-body">';
 if(s.phase==='scoring')html+=`<div class="round-step"><span class="stepnum">01</span><div><h3>Завершить раунд ${s.round}</h3><p class="muted smalltext">Очки остаются на табло. Отложенные правила разрешаются игроками.</p></div></div><div class="round-step"><span class="stepnum">02</span><div><h3>Снять эффекты этого раунда</h3><p class="muted smalltext">«Неумолимое наступление» завершится.</p></div></div><div class="round-step"><span class="stepnum">03</span><div><h3>Сохранить эффекты с другим сроком</h3><p class="muted smalltext">«Ускорение» останется до конца следующей активации Бессмертного стража.</p></div></div>${check('Подсчёт очков и все правила конца раунда разрешены.')} ${button('next','Начать раунд '+(s.round+1),true,!confirmed)}`;
 else if(s.phase==='initiative')html+=`<h2>Кто получает инициативу?</h2><p class="muted smalltext">Определите результат по правилам, затем отметьте выбор.</p><div class="summary"><p>CP будут начислены <b>после</b> этого выбора:</p><p>Игрок с инициативой: <strong>+1 CP</strong></p><p>Соперник: <strong>+2 CP</strong></p></div><div class="bottom-actions">${button('red','Круг Иеротек',true)}${button('blue','Культ Хаоса')}</div><p class="muted smalltext">Начало раунда уже снимет эффекты с истёкшим сроком; модели будут подготовлены в следующем шаге.</p>`;
 else if(s.phase==='ready')html+=`<span class="badge good">✓ CP начислены · модели готовы</span><div class="summary"><p><b>Инициатива:</b> ${esc(labelOwner(s.initiative))}</p><p><b>Живой металл (Living Metal)</b></p><p>Каждый дружественный оперативник Иеротек восстанавливает до <b>D3+1 WND</b>. Броски и применение лечения — вручную.</p><p>Затем разрешите остальные фракционные правила этого этапа.</p></div>${check('Фракционные правила этапа подготовки разрешены.')} ${button('next','Перейти к гамбитам',true,!confirmed)}`;
 else if(s.phase==='gambit'){
 const ours=s.gambitOwner==='red-id',strategy=effects(s).some(x=>x.title==='Неумолимое наступление');
 html+=`<h2>Сейчас выбирает: ${esc(labelOwner(s.gambitOwner))}</h2><p class="muted smalltext">Игроки чередуют гамбит и пас. Два паса подряд завершают этот этап.</p>`;
 if(ours&&edges().apply)html+=`<div class="summary"><p><b>Неумолимое наступление</b></p><p>Стрельба по цели в пределах <b>8″</b> от самого стрелка даёт оружию <button class="term" data-rule="balanced">Balanced</button>.</p><p><b>CP:</b> ${s.players['red-id'].cp} → ${s.players['red-id'].cp-1}</p><p><b>Срок:</b> до конца раунда ${s.round}</p></div>${check('Подтверждаю применение стратегической уловки.')} ${button('apply','Применить · 1 CP',true,!confirmed)}`;
 html+=`<div class="bottom-actions">${button('pass',ours?'Пас':'Соперник объявил пас',!edges().apply)}</div>`;
 }else html+=`<div class="summary"><strong>Раунд готов к игре</strong><p>Первым действует: ${esc(labelOwner(s.turnOwner))}.</p><p>«Ускорение» сохранилось до активации цели.</p></div><button class="full ghost" data-reset>Вернуться к началу примера</button>`;
 html+=`<div class="section"><h2>${s.phase==='scoring'?'Сохранятся после перехода':'Действующие эффекты'}</h2>${effectRows(effects(s).filter(e=>s.phase!=='scoring'||e.expiry.kind!=='round'))}</div></div><div class="dock-footer">Новый этап применяется один раз · фракционные решения остаются у игроков</div>`;$('dock').innerHTML=html;
}
const glossary={ap:{title:'AP и APL',body:'<p><b>APL</b> задаёт лимит стоимости действий активации. <b>AP</b> — стоимость конкретного действия.</p><p>Бесплатные действия и исключения отряда учитываются отдельно. Повтор одного действия требует правила, которое его разрешает.</p>'},shoot:{title:'Стрельба (Shoot)',body:'<p>Выберите оружие и допустимую цель, затем разрешите броски атаки, защиты и урон. В примере открыт момент выбора карабина Теслы.</p>'},blast:{title:'Взрыв (Blast x″)',body:'<p>После основной цели разрешаются атаки по дополнительным целям, видимым ей и находящимся в пределах указанной дистанции. Для каждой атаки отдельно проверяются правила разрешения.</p>'},devastating:{title:'Опустошительное (Devastating x)',body:'<p>Сохранённый критический успех немедленно наносит указанное число повреждений. Сам кубик сохраняется для дальнейшего разрешения атаки.</p><p>«Живая молния» убирает у этого профиля дистанционное условие, сохраняя значение <b>1</b>.</p>'},balanced:{title:'Сбалансированное (Balanced)',body:'<p>При броске кубиков атаки можно перебросить один кубик.</p>'}};
function openRule(key){const rule=key==='lightning'?{title:'Живая молния (Living Lightning)',body:DATA.catalog.ploys.lightning.fullText}:glossary[key];if(!rule)return;$('rule-title').textContent=rule.title;$('rule-body').innerHTML=key==='lightning'?esc(rule.body).replace(/&lt;(\/?b)&gt;/g,'<$1>').replace(/\n/g,'<br>'):rule.body;$('rule-dialog').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.scene){scene=b.dataset.scene;nodeId=scene;confirmed=false;message='';error=false;render();return}
 if(b.hasAttribute('data-reset')){nodeId=scene;confirmed=false;message='';error=false;render();return}
 if(b.hasAttribute('data-open-ploy')){scene='shoot';message='';render();return}
 if(b.hasAttribute('data-show-activation')){scene='activation';message='';render();return}
 if(b.dataset.rule){openRule(b.dataset.rule);return}
 if(b.dataset.step){const key=b.dataset.step,next=edges()[key];if(!next)return;if((key==='apply'||key==='next'&&['scoring','ready'].includes(state().phase))&&!confirmed){message='Подтверди условия перед применением.';error=true;render();return}const old=state();nodeId=next;confirmed=false;error=false;message=key==='apply'?'Уловка отмечена: CP списаны, эффект добавлен.':key==='undo'?'Последняя операция отменена.':key==='resolve'?'Действие завершено. Его временные эффекты сняты.':key==='finish'?'Активация завершена.':key==='red'||key==='blue'?'Инициатива отмечена, CP начислены один раз.':key==='shoot'?'Стрельба начата. Открыто окно выбора оружия.':key==='dash'?'Рывок отмечен: потрачен 1 AP.':'Этап партии обновлён.';render()}
});
document.addEventListener('change',e=>{if(e.target.id==='confirm'){confirmed=e.target.checked;render();const c=$('confirm');if(c)c.focus()}});
$('close-rule').addEventListener('click',()=>$('rule-dialog').close());
render();
</script></body></html>
